name: Update udata-hosted feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      id: app-token
      with:
        app-id: ${{ secrets.GH_BOT_APP_ID }}
        private-key: ${{ secrets.GH_BOT_APP_PRIVATE_KEY }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        token: ${{ steps.app-token.outputs.token }}
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.10'
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        cache-dependency-glob: uv.lock
    - name: Install transitland-lib
      run: scripts/install-transitland-lib.sh
    - name: Re-pin feeds whose udata publisher mints a resource per snapshot
      run: uv run --locked scripts/update-udata-urls.py
    - name: Format in the opinionated DMFR format
      run: |
        find ./feeds -type f -name "*.dmfr.json" -exec transitland dmfr format --save {} \;
    - name: Validate feeds
      working-directory: scripts
      run: uv run --locked validate-feeds.py
    - name: Open or update auto-PR if anything changed
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        scripts/auto-pr.sh \
          --branch-name "auto/udata-feeds" \
          --pr-title "Automatic update of udata-hosted feeds" \
          --pr-body "Automatically re-pinned feeds tagged \`udata_host\`/\`udata_dataset\`, whose publishers mint a new resource per snapshot rather than updating one in place." \
          --commit-message "Re-pinned udata-hosted feeds at $(date -u)" \
          --trigger-workflow ""
