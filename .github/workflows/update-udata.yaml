name: Update udata-hosted feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

# GITHUB_TOKEN only needs to read; pushes and PRs go through the app token.
permissions:
  contents: read

# Two runs would race to update the same auto-PR branch; let the first finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        app-id: ${{ secrets.GH_BOT_APP_ID }}
        private-key: ${{ secrets.GH_BOT_APP_PRIVATE_KEY }}
        # auto-pr.sh only pushes a branch and opens or updates its PR.
        permission-contents: write
        permission-pull-requests: write
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ steps.app-token.outputs.token }}
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        cache-dependency-glob: uv.lock
    - name: Cache transitland binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/transitland
        key: transitland-${{ runner.os }}-${{ hashFiles('scripts/install-transitland-lib.sh') }}
    - name: Install transitland-lib
      run: scripts/install-transitland-lib.sh
    - name: Re-pin feeds whose udata publisher mints a resource per snapshot
      run: uv run --locked scripts/update-udata-urls.py
    - name: Format in the opinionated DMFR format
      run: |
        find ./feeds -type f -name "*.dmfr.json" -exec transitland dmfr format --save {} \;
    - name: Validate feeds
      working-directory: scripts
      run: uv run --locked validate-feeds.py
    - name: Open or update auto-PR if anything changed
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        scripts/auto-pr.sh \
          --branch-name "auto/udata-feeds" \
          --pr-title "Automatic update of udata-hosted feeds" \
          --pr-body "Automatically re-pinned feeds tagged \`udata_host\`/\`udata_dataset\`, whose publishers mint a new resource per snapshot rather than updating one in place." \
          --commit-message "Re-pinned udata-hosted feeds at $(date -u)" \
          --trigger-workflow ""
