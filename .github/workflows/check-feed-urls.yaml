name: Validate static and RT URLs in changed DMFR files

on:
  pull_request_target:
    paths:
      - 'feeds/*.dmfr.json'
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

# A new push to the PR supersedes the validation still running for the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Run the base branch's workflow and scripts; take only feeds/ from the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the PR's feeds/
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "pull/$PR_NUMBER/head"
          # --no-overlay also drops files the PR deletes.
          git checkout --no-overlay "$HEAD_SHA" -- feeds

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Cache transitland binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/transitland
          key: transitland-${{ runner.os }}-${{ hashFiles('scripts/install-transitland-lib.sh') }}
      - name: Install transitland-lib
        run: scripts/install-transitland-lib.sh

      - name: Determine changed feed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          changed=$(git diff --name-only "origin/$BASE_REF" "$HEAD_SHA" -- 'feeds/*.dmfr.json' || true)
          delim="FILES_$(openssl rand -hex 8)"
          {
            echo "files<<$delim"
            echo "$changed"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Validate URLs proposed in this PR
        id: validate
        if: steps.changed.outputs.files != ''
        env:
          BASE_REF: ${{ github.base_ref }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          mkdir -p reports
          mapfile -t files < <(printf '%s\n' "$CHANGED_FILES" | sed '/^$/d')
          rc=0
          uv run --locked scripts/validate-changed-feed-urls.py \
            --base-ref "$BASE_REF" \
            --reports-dir reports \
            --summary-out reports/summary.md \
            "${files[@]}" || rc=$?
          # Random delimiter, so no line of the summary can end the block early.
          delim="SUMMARY_$(openssl rand -hex 8)"
          {
            echo "summary<<$delim"
            cat reports/summary.md 2>/dev/null || true
            echo "$delim"
            echo "any_blocker=$([ $rc -eq 0 ] && echo 0 || echo 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload validation reports
        if: steps.changed.outputs.files != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-url-validation-reports
          path: reports/

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY: ${{ steps.validate.outputs.summary }}
        with:
          script: |
            const summary = (process.env.SUMMARY || '').trim();

            const existing = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const prior = existing.find(c =>
              c.user.type === 'Bot' && c.body.includes('Feed URL validation')
            );

            let body;
            if (summary) {
              body =
                `## Feed URL validation\n\n${summary}\n\n` +
                `<sub>Pass criteria: static feed fetches, parses, and has ≥1 agency record; ` +
                `RT feed returns a valid GTFS-RT message. 💡 bullets are style ` +
                `advisories (don't gate the check). Other counts shown for context only — ` +
                `feed contributors often don't control source quality. ` +
                `Auth-protected URLs are validated by tlv2 with private keys, not here. ` +
                `Full reports attached as workflow artifacts.</sub>`;
            } else if (prior) {
              // No URL changes need validation in the latest push, but a prior
              // bot comment exists — replace it with a resolved message.
              body = `## Feed URL validation\n\n✅ No URL changes need validation in the latest push.`;
            } else {
              // Nothing to post and no prior comment to update.
              return;
            }

            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: prior.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              });
            }

      - name: Fail if any feed URL could not be validated
        if: steps.validate.outputs.any_blocker == '1'
        run: |
          echo "One or more URLs failed the minimum bar."
          echo "Static: must fetch + parse + have ≥1 agency."
          echo "RT: must return a valid GTFS-RT message."
          exit 1
