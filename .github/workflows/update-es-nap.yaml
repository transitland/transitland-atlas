name: Update Spanish NAP feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

# GITHUB_TOKEN only needs to read; pushes and PRs go through the app token.
permissions:
  contents: read

# Two runs would race to update the same auto-PR branch; let the first finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        app-id: ${{ secrets.GH_BOT_APP_ID }}
        private-key: ${{ secrets.GH_BOT_APP_PRIVATE_KEY }}
        # auto-pr.sh only pushes a branch and opens or updates its PR.
        permission-contents: write
        permission-pull-requests: write
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ steps.app-token.outputs.token }}
    - name: Install uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        cache-dependency-glob: uv.lock
    - name: Cache transitland binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/transitland
        key: transitland-${{ runner.os }}-${{ hashFiles('scripts/install-transitland-lib.sh') }}
    - name: Install transitland-lib
      run: scripts/install-transitland-lib.sh
    - name: Fetch latest Spanish NAP data
      working-directory: external-data-for-reference/spain
      run: uv run --locked collect-nap-gtfs.py
      env:
        SPANISH_NAP_API_KEY: ${{ secrets.SPANISH_NAP_API_KEY }}
    - name: Format in the opinionated DMFR format
      run: transitland dmfr format --save feeds/gtfs-source-feeds.transit.land.dmfr.json
    - name: Validate feeds
      working-directory: scripts
      run: uv run --locked validate-feeds.py
      env:
        DMFR_SCHEMA_VERSION: v0.6.0
    - name: Open or update auto-PR if anything changed
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        scripts/auto-pr.sh \
          --branch-name "auto/spanish-nap" \
          --pr-title "Automatic update of Spanish NAP feeds" \
          --pr-body "Automatically updated Spanish NAP feeds from nap.transportes.gob.es" \
          --commit-message "Updated Spanish NAP feeds from nap.transportes.gob.es at $(date -u)" \
          --trigger-workflow ""
