name: Compare repointed static feed URLs

# When a PR changes an existing feed's static_current URL, fetch both the old
# and new URL, compare them side by side, and post the result as a PR comment.
# Advisory only: this never fails the check.
#
# Nothing from the PR is executed: both jobs run the base branch's copy of
# scripts/ and read the PR's DMFR files through git.
#
# The work is split so TRANSITLAND_API_KEY never shares a job with the
# transitland binary fetching arbitrary URLs. `probe` does all the fetching
# with no secrets and a read-only token. `comment` gets the key from the
# transitland-api environment, which only main can use, and runs a
# standard-library script over probe's JSON output.
on:
  pull_request_target:
    paths:
      - 'feeds/*.dmfr.json'
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: compare-feed-urls-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head
        id: revs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "pull/$PR_NUMBER/head"
          # Diff against the merge base so commits landed on main since the
          # branch was cut are not attributed to the PR.
          echo "base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install transitland-lib
        run: scripts/install-transitland-lib.sh

      - name: Fetch and validate old and new static_current URLs
        env:
          BASE: ${{ steps.revs.outputs.base }}
          HEAD: ${{ steps.revs.outputs.head }}
        run: |
          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD" -- 'feeds/*.dmfr.json')
          uv run --locked scripts/compare-changed-feed-urls.py probe \
            --base "$BASE" --head "$HEAD" --out reports/probes.json \
            "${files[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feed-url-probes
          path: reports/probes.json

  comment:
    needs: probe
    runs-on: ubuntu-latest
    environment: transitland-api
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: feed-url-probes
          path: reports

      - name: Render comparison
        env:
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
        run: |
          python3 scripts/compare-changed-feed-urls.py render \
            --probes reports/probes.json --summary-out reports/compare.md
          cat reports/compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- feed-url-comparison -->';
            const summary = fs.readFileSync('reports/compare.md', 'utf8').trim();

            const existing = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const prior = existing.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            let body;
            if (summary) {
              body =
                `${marker}\n## Static feed URL comparison\n\n` +
                `This PR changes the \`static_current\` URL of an existing feed. ` +
                `Here is how the current and proposed URLs compare right now:\n\n` +
                `${summary}\n\n` +
                `<sub>Advisory only; does not block merging. Recommendations are ` +
                `based on what each URL serves at the time of this run. ` +
                `"Contents SHA1" hashes the feed's files independent of zip ` +
                `packaging, so matching values mean the same data.</sub>`;
            } else if (prior) {
              body = `${marker}\n## Static feed URL comparison\n\n` +
                `✅ The latest push no longer changes any existing feed's \`static_current\` URL.`;
            } else {
              return;
            }

            // GitHub caps comment bodies at 65536 characters.
            if (body.length > 65000) {
              body = body.slice(0, 64000) +
                `\n\n…truncated. See the workflow run for the full output: ` +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            }

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (prior) {
              await github.rest.issues.updateComment({ ...params, comment_id: prior.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }
