name: Test scripts

# Only when scripts/ changes: the tests cover the helpers in that directory and
# nothing else, so a feed-only PR has no reason to run them.
#
# Only on push, which means only on branches in this repository. Fork pull
# requests deliberately do not run here: this executes code from scripts/, and
# the Validate workflow rejects fork PRs that touch that directory for the same
# reason. A fork's own pushes run in the fork.
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/test-scripts.yaml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch supersedes the test run still going for the last one;
# main is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # atlas_registry.load() builds its index by shelling out to `transitland
      # sync`, so the registry tests need the binary even though everything
      # else in the suite is pure.
      - name: Cache transitland binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/transitland
          key: transitland-${{ runner.os }}-${{ hashFiles('scripts/install-transitland-lib.sh') }}
      - name: Install transitland-lib
        run: scripts/install-transitland-lib.sh
      # Run from the repository root so uv resolves pyproject.toml, where the
      # test dependencies are declared rather than in the test files.
      - name: Run tests
        # external-data-for-reference holds the sync jobs that mint Onestop
        # ids for the Japanese and Spanish feeds, so their tests run here too.
        run: uv run --with pytest pytest scripts/ external-data-for-reference/ -q
